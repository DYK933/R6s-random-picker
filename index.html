<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    background: #1b1f27; color: #e6e8ec;

  }
  .container { width: 100%; max-width: 640px; }
  h1 { color: #f2a900; font-size: 24px; text-align: center; margin: 18px 0 14px; }
  fieldset {
    border: 1px solid #333a47; border-radius: 6px;
    padding: 10px 16px; margin-bottom: 12px;
  }
  legend { color: #c8ccd4; font-size: 14px; padding: 0 6px; }
  label.radio, label.check {

    border-radius: 4px; padding: 4px 8px; font-size: 14px; max-width: 100%;
  }
  .hint { color: #8a919e; font-size: 12px; text-align: center; margin: 4px 0 10px; }
  .btn-row { display: flex; gap: 14px; justify-content: center; margin: 14px 0; }
  button {
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 16px; font-weight: bold; padding: 12px 0; flex: 1; max-width: 220px;
    font-family: inherit; transition: opacity .15s;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #rollBtn { background: #f2a900; color: #1b1f27; }
  #rollBtn:not(:disabled):hover { background: #ffc633; }
  #resetBtn { background: #333a47; color: #e6e8ec; }
  #resetBtn:hover { background: #454e5e; }
  .results {
    background: #12151b; border: 1px solid #333a47; border-radius: 6px;
    padding: 14px 18px; margin-bottom: 20px;
  }
  .rrow { display: flex; padding: 10px 0; align-items: baseline; }
  .rrow .name { color: #8a919e; font-weight: bold; width: 110px; font-size: 15px; flex-shrink: 0; }
  .rrow .val { color: #e6e8ec; font-weight: bold; font-size: 15px; word-break: break-all; }
  .rrow .val.done { color: #f2a900; }
  .rrow .val.empty { color: #5a616e; }
  @media (max-width: 480px) {
    .rrow .name { width: 90px; font-size: 13px; }
    .rrow .val { font-size: 13px; }
  }
</style>

<div class="container">
  <h1>RAINBOW SIX SIEGE 随机抽取</h1>

  <fieldset>

</div>

mmando 9", "P10 RONI"], "secondary": ["SDP 9mm", "Super Shorty"], "gadgets": ["遥控炸药(C4)", "倒刺铁丝网", "冲击手榴弹"]}, "Warden": {"primary": ["M590A1", "MPX"], "secondary": ["P-10C", "SMG-12"], "gadgets": ["遥控炸药(C4)", "机动护盾", "观测工具阻拦器"]}, "Goyo": {"primary": ["Vector .45 ACP", "TCSG12"], "secondary": ["P229"], "gadgets": ["冲击手榴弹", "防弹摄像头", "感应警报器"]}, "Wamai": {"primary": ["AUG A2", "MP5K"], "secondary": ["Keratos .357", "Super Shorty", "P12"], "gadgets": ["遥控炸药(C4)", "机动护盾", "感应警报器"]}, "Oryx": {"primary": ["SPAS-12", "T-5 SMG"], "secondary": ["Bailiff 410", "USP40", "Reaper MK2"], "gadgets": ["倒刺铁丝网", "感应警报器"]}, "Melusi": {"primary": ["MP5", "Super 90"], "secondary": ["RG15", "ITA12S"], "gadgets": ["防弹摄像头", "冲击手榴弹"]}, "Aruni": {"primary": ["P10 RONI", "Mk 14 EBR"], "secondary": ["PRB92"], "gadgets": ["倒刺铁丝网", "防弹摄像头"]}, "Thunderbird": {"primary": ["SPEAR .308", "SPAS-15"], "secondary": ["BEARING 9", "Q-929", "ITA12S"], "gadgets": ["倒刺铁丝网", "防弹摄像头", "机动护盾", "冲击手榴弹", "感应警报器"]}, "Thorn": {"primary": ["UZK50GI", "M870"], "secondary": ["1911 TACOPS", "C75 Auto"], "gadgets": ["倒刺铁丝网", "机动护盾"]}, "Azami": {"primary": ["9x19VSN", "ACS12"], "secondary": ["D-50"], "gadgets": ["冲击手榴弹", "倒刺铁丝网"]}, "Solis": {"primary": ["P90", "ITA12L"], "secondary": ["SMG-11"], "gadgets": ["冲击手榴弹", "感应警报器"]}, "Fenrir": {"primary": ["MP7", "SASG-12"], "secondary": ["5.7 USG"], "gadgets": ["防弹摄像头", "观测工具阻拦器"]}, "Tubarao": {"primary": ["MPX", "AR-15.50"], "secondary": ["P226 Mk 25"], "gadgets": ["遥控炸药(C4)", "感应警报器"]}, "Skopos": {"primary": ["PCX-33"], "secondary": ["P229"], "gadgets": ["冲击手榴弹", "感应警报器"]}, "Denari": {"primary": ["FMG-9", "SCORPION EVO 3 A1"], "secondary": ["P226 MK 25", "Glaive-12"], "gadgets": ["机动护盾", "观测工具阻拦器"]}, "Noor": {"primary": ["Commando 9", "ALDA 5.56"], "secondary": ["1911 TACOPS", "Bailiff 410"], "gadgets": ["倒刺铁丝网", "机动护盾"]}}};

const MODULES = ["operator", "weapon", "attachment", "gadget"];
const MODULE_NAMES = { operator:"角色抽取", weapon:"武器抽取", attachment:"武器配件抽取", gadget:"道具抽取" };

// ---------- 状态 ----------
let rolling = false;
let results = {};        // {板块key: 结果文本}
let drawnOp = null;      // 本轮已确定的干员
let drawnSide = null;
let drawnWeapons = null; // 本次武器（供配件判断限定瞄具）

// ---------- 瞄具规则（与 Python 版一致） ----------
const FIXED_SIGHT_GUNS = ["15型半自动手枪", "P-10C", "Bailiff 410"];
const SCOPE_RULES = {
  "霰弹枪": { allow_25: ["ACS12", "TCSG12", "BOSG.12.2"], allow_35: [] },
  "冲锋枪": { allow_25: ["PDW9", "FMG-9"], allow_35: [] },
};
const OPERATOR_SCOPE_BAN = {
  "Smoke":   { "FMG-9": ["2.5倍"] },
  "Aruni":   { "Mk 14 EBR": ["3.5倍"] },
  "Tubarao": { "AR-15.50": ["3.5倍"] },
};

function weaponCategory(name) {
  for (const [cat, lst] of Object.entries(DATA.weapons)) {
    if (lst.includes(name)) return cat;
  }
  return null;
}

function sightsFor(weapon) {
  const sights = DATA.attachments["瞄具"];
  let pool = [...sights["通用"]];
  const rule = SCOPE_RULES[weaponCategory(weapon)];
  const banned = [];
  if (rule) {
    if (!rule.allow_25.includes(weapon)) banned.push("2.5倍");
    if (!rule.allow_35.includes(weapon)) banned.push("3.5倍");
  }
  if (drawnOp && OPERATOR_SCOPE_BAN[drawnOp] && OPERATOR_SCOPE_BAN[drawnOp][weapon]) {
    banned.push(...OPERATOR_SCOPE_BAN[drawnOp][weapon]);
  }
  if (banned.length) {
    pool = pool.filter(s => !banned.some(b => s.startsWith(b)));
  }
  return pool;
}

function sightPool() {
  const sights = DATA.attachments["瞄具"];
  const weapons = (drawnWeapons || []).filter(w => w && w !== "无");
  if (weapons.some(w => FIXED_SIGHT_GUNS.includes(w))) {
    return sights["固定红点"];
  }
  let pool;
  if (weapons.length) {
    pool = sightsFor(weapons[0]);
    for (const w of weapons.slice(1)) {
      const allowed = new Set(sightsFor(w));
      pool = pool.filter(s => allowed.has(s));
    }
  } else {
    pool = [...sights["通用"]];
  }
  if (weapons.includes("DP27")) {
    pool = pool.concat(sights["DP27专用"]);
  }
  return pool;
}

// ---------- 生成器 ----------
function pickSide() {
  const s = document.querySelector('input[name=side]:checked').value;
  return s === "random" ? (Math.random() < 0.5 ? "attack" : "defense") : s;
}

function genOperator(side) {
  const pool = side === "attack" ? DATA.attackers : DATA.defenders;
  const op = pool[Math.floor(Math.random() * pool.length)];
  return (side === "attack" ? "进攻方 · " : "防守方 · ") + op;
}

function loadout(opName) {
  return opName ? (DATA.loadouts[opName] || null) : null;
}

function genWeapon(opName) {
  const lo = loadout(opName);
  if (lo) {
    const prim = lo.primary.length ? lo.primary[Math.floor(Math.random() * lo.primary.length)] : "无";
    const sec  = lo.secondary.length ? lo.secondary[Math.floor(Math.random() * lo.secondary.length)] : "无";
    drawnWeapons = [prim, sec];
    return `主武器：${prim} ｜ 副武器：${sec}`;
  }
  const cats = Object.keys(DATA.weapons);
  const cat = cats[Math.floor(Math.random() * cats.length)];
  const lst = DATA.weapons[cat];
  const w = lst[Math.floor(Math.random() * lst.length)];
  drawnWeapons = [w, null];
  return cat + " · " + w;
}

function genAttachment() {
  const atts = DATA.attachments;
  const parts = [];
  for (const k of Object.keys(atts)) {
    const pool = k === "瞄具" ? sightPool() : atts[k];
    parts.push(k + ":" + pool[Math.floor(Math.random() * pool.length)]);
  }
  return parts.join(" | ");
}

function genGadget(side, opName) {
  const lo = loadout(opName);
  if (lo && lo.gadgets && lo.gadgets.length) {
    const pool = lo.gadgets;
    if ((opName === "Striker" || opName === "Sentry") && pool.length >= 2) {
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      return "次要装备 ×2：" + shuffled.slice(0, 2).join(" ＋ ");
    }
    return "次要装备：" + pool[Math.floor(Math.random() * pool.length)];
  }
  const pool = side === "attack" ? DATA.gadgets.attack : DATA.gadgets.defense;
  return (side === "attack" ? "进攻方 · " : "防守方 · ") + pool[Math.floor(Math.random() * pool.length)];
}

// 供动画期间滚动显示的随机文本
const rollerFns = {
  operator:   () => genOperator(pickSide()),
  weapon:     () => { const c = Object.keys(DATA.weapons); const cat = c[Math.floor(Math.random()*c.length)]; const l = DATA.weapons[cat]; return cat + " · " + l[Math.floor(Math.random()*l.length)]; },
  attachment: () => genAttachment(),
  gadget:     () => { const s = Math.random() < 0.5 ? "attack" : "defense"; const p = s === "attack" ? DATA.gadgets.attack : DATA.gadgets.defense; return (s === "attack" ? "进攻方 · " : "防守方 · ") + p[Math.floor(Math.random()*p.length)]; },
};

// ---------- 干员下拉 ----------
function initOpSelect() {
  const sel = document.getElementById("opSelect");
  let opts = ['<option value="随机">随机</option>'];
  for (const n of DATA.attackers) opts.push(`<option value="${n}">${n}（进攻）</option>`);
  for (const n of DATA.defenders) opts.push(`<option value="${n}">${n}（防守）</option>`);
  sel.innerHTML = opts.join("");
  sel.addEventListener("change", onOpChange);
}

function selectedOperator() {
  const v = document.getElementById("opSelect").value;
  return v === "随机" ? null : v;
}

function onOpChange() {
  for (const key of ["operator", "weapon", "gadget"]) {
    delete results[key];
    const el = document.getElementById("r_" + key);
    el.textContent = "——";
    el.className = "val empty";
  }
  drawnOp = null; drawnSide = null; drawnWeapons = null;
}

// ---------- 抽取 ----------
function roll() {
  if (rolling) return;
  const enabled = MODULES.filter(k => document.getElementById("m_" + k).checked);
  if (!enabled.length) { alert("请至少勾选一个抽取板块！"); return; }

  // 未勾选板块的旧结果作废
  for (const key of Object.keys(results)) {
    if (!enabled.includes(key)) {
      delete results[key];
      const el = document.getElementById("r_" + key);
      el.textContent = "——";
      el.className = "val empty";
      if (key === "weapon") drawnWeapons = null;
    }
  }

  const pending = enabled.filter(k => !(k in results));
  if (!pending.length) {
    alert("勾选的板块均已抽取完毕，如需重抽请点击“重 置”。");
    return;
  }

  // 确定干员：定向选择 > 已抽取保留 > 本次随机
  const targetOp = selectedOperator();
  let opName, side;
  if (targetOp) {
    opName = targetOp;
    side = DATA.attackers.includes(targetOp) ? "attack" : "defense";
  } else if (drawnOp) {
    opName = drawnOp; side = drawnSide;
  } else if (enabled.includes("operator")) {
    side = pickSide();
    const pool = side === "attack" ? DATA.attackers : DATA.defenders;
    opName = pool[Math.floor(Math.random() * pool.length)];
  } else {
    side = drawnSide || pickSide();
    opName = null;
    if (pending.includes("weapon") || pending.includes("gadget")) {
      const pool = side === "attack" ? DATA.attackers : DATA.defenders;
      opName = pool[Math.floor(Math.random() * pool.length)];
    }
  }
  if (opName) { drawnOp = opName; drawnSide = side; }

  // 先算好各板块最终结果
  const finals = {};
  for (const key of pending) {
    if (key === "operator") {
      if (!opName) continue;
      finals[key] = (side === "attack" ? "进攻方 · " : "防守方 · ") + opName;
    } else if (key === "weapon") {
      finals[key] = genWeapon(opName);
    } else if (key === "attachment") {
      finals[key] = genAttachment();
    } else if (key === "gadget") {
      finals[key] = genGadget(side, opName);
    }
  }

  // 滚动动画后定格（动画期间展示随机文本）
  rolling = true;
  const btn = document.getElementById("rollBtn");
  btn.disabled = true;
  btn.textContent = "抽 取 中 ...";

  const pendingAnims = pending.filter(k => finals[k] !== undefined);
  let finished = 0;
  for (const key of pendingAnims) {
    animate(key, finals[key], () => {
      results[key] = finals[key];
      finished++;
      if (finished === pendingAnims.length) {
        rolling = false;
        btn.disabled = false;
        btn.textContent = "开 始 抽 取";
      }
    });
  }
  for (const key of pending) {
    if (!(key in finals)) results[key] = results[key]; // 保底
  }
}

function animate(key, final, done) {
  const el = document.getElementById("r_" + key);
  el.className = "val";
  let step = 0, delay = 45;
  function tick() {
    if (step >= 14) {
      el.textContent = final;
      el.className = "val done";
      done();
      return;
    }
    el.textContent = rollerFns[key]();
    step++;
    delay = Math.round(delay * 1.22);
    setTimeout(tick, delay);
  }
  tick();
}

function resetAll() {
  results = {};
  drawnOp = null; drawnSide = null; drawnWeapons = null;
  for (const key of MODULES) {
    const el = document.getElementById("r_" + key);
    el.textContent = "——";
    el.className = "val empty";
  }
}

// ---------- 初始化 ----------
initOpSelect();
document.getElementById("rollBtn").addEventListener("click", roll);
document.getElementById("resetBtn").addEventListener("click", resetAll);
</script>
